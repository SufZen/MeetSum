name: meetsum

# One-off migrations, merged with docker-compose.prod.yml so `migrate` can see
# the postgres service:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.migrate.yml run --rm migrate
#
# It runs the same image as app and worker (meetsum:${MEETSUM_IMAGE_TAG});
# scripts/deploy-vps.sh runs it with the NEW image before switching app and
# worker over (migrations must stay backward-compatible with the previous
# release: docs/runbooks/deploy.md "Expand/contract").

services:
  migrate:
    image: meetsum:${MEETSUM_IMAGE_TAG:-current}
    command: ["npm", "run", "db:migrate"]
    env_file:
      - .env.local
    volumes:
      - /opt/meetsum/secrets:/opt/meetsum/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Same resolvers as app/worker: Docker's embedded DNS first (service
    # names), then public IPv4 resolvers, because the host's upstream is
    # IPv6/Tailscale-only (the old "Tailscale DNS interference" workaround).
    dns:
      - 127.0.0.11
      - 185.12.64.2
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
