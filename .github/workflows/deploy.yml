name: Deploy

# M10 B5 (docs/runbooks/deploy.md): one deploy path. This workflow only runs
# scripts/deploy-vps.sh on the VPS over SSH; the script does the lock, the
# backup, one image build, migrations before the switch, the readiness wait
# and the automatic rollback.
#
# Quality gate: the full CI workflow (Node 24: typecheck, lint, ds:check,
# tests, build, bundle:check, schema). A deploy starts only after CI
# succeeded for a push to main, and it deploys exactly that commit
# (DEPLOY_SHA). Nothing runs unless the repository variable
# DEPLOY_ENABLED is 'true' (it is unset: nothing is deployed).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    if: >-
      github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))

    steps:
      - name: Deploy via SSH (scripts/deploy-vps.sh)
        # appleboy/ssh-action v1.2.2, pinned by commit SHA.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 25m
          envs: DEPLOY_SHA
          script: |
            set -eu
            cd /opt/meetsum
            DEPLOY_SHA="$DEPLOY_SHA" ./scripts/deploy-vps.sh

      - name: Post deploy status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "Deployment $JOB_STATUS"
          echo "Commit: $DEPLOYED_SHA"
          echo "Triggered by: $ACTOR"
