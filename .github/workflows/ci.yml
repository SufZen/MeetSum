name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Keep in sync with the Dockerfile base image (node:24-alpine).
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      # M9 ratchet: no design-system rule may rise above design-system/baseline.json
      # (the Integration step switches this to --strict).
      - name: Design-system guardrails
        run: npm run ds:check

      - name: Run tests
        run: npm test

      # The build needs no runtime secrets: route modules resolve storage and
      # other runtime config lazily, and instrumentation.ts only validates the
      # environment when the server boots.
      - name: Build
        run: npm run build
        env:
          # Matches the Dockerfile: next build's TypeScript pass exceeds V8's
          # default old-space cap.
          NODE_OPTIONS: --max-old-space-size=4096

      # M9 ratchet: first-load JS per route against bundle-budget.json.
      - name: Bundle budget
        run: npm run bundle:check
