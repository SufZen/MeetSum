name: Desktop Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop-recorder/**"
      - "electron-builder.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-windows.yml"
  push:
    branches:
      - main
    paths:
      - "desktop-recorder/**"
      - "electron-builder.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-windows.yml"

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run desktop companion tests
        run: npm test -- tests/desktop-recorder-companion.test.ts tests/desktop-recorder-packaging.test.ts tests/desktop-capture-route.test.ts

      - name: Build Windows artifacts
        run: npm run desktop:dist:win

      - name: Verify Windows signatures
        if: ${{ env.WIN_CSC_LINK != '' }}
        shell: pwsh
        run: ./scripts/verify-windows-signature.ps1 -Path desktop-recorder/release

      - name: Upload installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meetsum-capture-windows
          path: |
            desktop-recorder/release/*.exe
            desktop-recorder/release/*.blockmap
            desktop-recorder/release/latest.yml
          if-no-files-found: error
