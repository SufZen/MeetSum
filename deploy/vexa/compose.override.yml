# MeetSum override for the upstream Vexa v0.12.28 compose project. Applied by
# deploy/vexa/bootstrap.sh:
#
#   docker compose -p vexa --env-file vexa.env \
#     -f $VEXA_HOME/deploy/compose/docker-compose.yml -f deploy/vexa/compose.override.yml \
#     up -d gateway
#
# (`gateway` pulls in admin-api, meeting-api, runtime, redis, postgres, storage
# and storage-init through depends_on; the agent, flows, mcp, terminal and
# dashboard services are not started.)
#
# What it changes (service names verified against v0.12.28, deploy/vexa/VERIFIED.md):
#   - images pinned by tag + digest (same values as vexa.lock);
#   - every published port removed (`!reset`, Compose >= 2.24.4) except the
#     gateway, which stays on loopback for `npm run vexa:configure` from the host;
#   - gateway and meeting-api join the internal `meetsum-vexa` network
#     (aliases vexa-gateway / vexa-meeting-api); MeetSum reaches the gateway
#     at http://vexa-gateway:8000. Vexa is never routed through Traefik;
#   - recordings go to MeetSum's MinIO (meetsum-minio:9000) with dedicated,
#     bucket-scoped credentials (MINIO_* are the variable names meeting-api and
#     storage-init read at the tag). Upstream's versitygw `storage` still runs
#     (storage-init depends on it) but holds nothing. MeetSum reads recordings
#     through the Vexa API, so the backend doesn't change behaviour;
#   - RECORDING_ENABLED=true, TRANSCRIBE_ENABLED=false (MeetSum's ASR router
#     makes the transcript), no agent domain (AGENT_API_URL empty);
#   - per-service memory and CPU limits sized for the ~7.6 GB VPS. Each bot
#     container the runtime spawns needs ~1 vCPU / 1 GB on top of these.

x-limits-small: &limits-small
  mem_limit: 256m
  cpus: 0.5

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    ports: !reset []
    mem_limit: 384m
    cpus: 0.5

  redis:
    image: valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    <<: *limits-small

  storage:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    ports: !reset []
    mem_limit: 128m
    cpus: 0.25

  storage-init:
    image: vexaai/v012-meeting-api:v0.12.28@sha256:cca46266feedcff29c3478472fd40133ba51f3c49a489a290040a56f1f0f3dca
    environment:
      - MINIO_ENDPOINT=meetsum-minio:9000
      - MINIO_ACCESS_KEY=${VEXA_MINIO_ACCESS_KEY:?VEXA_MINIO_ACCESS_KEY is required}
      - MINIO_SECRET_KEY=${VEXA_MINIO_SECRET_KEY:?VEXA_MINIO_SECRET_KEY is required}
      - MINIO_BUCKET=${VEXA_MINIO_BUCKET:-vexa-recordings}
      - MINIO_SECURE=false
    networks:
      - vexa
      - meetsum-vexa
    <<: *limits-small

  admin-api:
    image: vexaai/v012-admin-api:v0.12.28@sha256:4c702354384eafe3a933cd537a106b7c15067cfd368a5f6da1a6e675e7e03e04
    ports: !reset []
    <<: *limits-small

  runtime:
    image: vexaai/v012-runtime:v0.12.28@sha256:a1f6448fbb380b9433364e8b572ec25a12aa4f274bf403f1d83a89cbf5812f2d
    ports: !reset []
    environment:
      - BROWSER_IMAGE=${BROWSER_IMAGE:?BROWSER_IMAGE is required (see vexa.lock)}
      - DOCKER_NETWORK=vexa_vexa
    mem_limit: 384m
    cpus: 0.5

  meeting-api:
    image: vexaai/v012-meeting-api:v0.12.28@sha256:cca46266feedcff29c3478472fd40133ba51f3c49a489a290040a56f1f0f3dca
    ports: !reset []
    environment:
      - RECORDING_ENABLED=true
      - TRANSCRIBE_ENABLED=false
      - DEFAULT_BOT_NAME=${DEFAULT_BOT_NAME:-MeetSum Notetaker}
      - MINIO_ENDPOINT=meetsum-minio:9000
      - MINIO_ACCESS_KEY=${VEXA_MINIO_ACCESS_KEY:?VEXA_MINIO_ACCESS_KEY is required}
      - MINIO_SECRET_KEY=${VEXA_MINIO_SECRET_KEY:?VEXA_MINIO_SECRET_KEY is required}
      - MINIO_BUCKET=${VEXA_MINIO_BUCKET:-vexa-recordings}
      - MINIO_SECURE=false
    networks:
      vexa: {}
      meetsum-vexa:
        aliases:
          - vexa-meeting-api
    mem_limit: 512m
    cpus: 0.75

  gateway:
    image: vexaai/v012-gateway:v0.12.28@sha256:2e76319812f28adbb6bc328ac0a7484d3826924a9d38a9dd9599dd190fbb0f19
    ports: !reset
      - "127.0.0.1:18056:8000"
    environment:
      - AGENT_API_URL=
      - GUARD_TRUSTED_PROXIES=${GUARD_TRUSTED_PROXIES:-}
    networks:
      vexa: {}
      meetsum-vexa:
        aliases:
          - vexa-gateway
    mem_limit: 256m
    cpus: 0.5

networks:
  meetsum-vexa:
    external: true
