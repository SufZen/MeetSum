name: meetsum

# M10 B5 (docs/runbooks/deploy.md):
# - app, worker and migrate (docker-compose.migrate.yml) share one image,
#   meetsum:${MEETSUM_IMAGE_TAG}; only `app` declares `build`, so a deploy runs
#   one `next build`. scripts/deploy-vps.sh sets MEETSUM_IMAGE_TAG to the git
#   SHA and keeps meetsum:current / meetsum:previous for rollback.
# - Every third-party image is pinned by tag AND digest (resolved 2026-10-14;
#   tests/image-pins.test.ts, Dependabot proposes bumps). The one exception is
#   minio (see its comment).
# - Infra (postgres, redis, minio) is pinned to what production runs since
#   v0.6.0. Switching infra is always explicit, never a side effect of an app
#   deploy: the runbooks add docker-compose.pgvector.yml or
#   docker-compose.minio-source.yml, and scripts/deploy-vps.sh only ever runs
#   `up -d --no-deps app worker` and refuses when a running infra container's
#   image ID differs from the configured one (scripts/infra-drift.sh).
# - A host-local, git-ignored docker-compose.local.yml is added with -f by the
#   deploy and rollback scripts whenever it exists (docs/runbooks/deploy.md).
# - Logs rotate (json-file, 10 MB x 5 per container).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    image: meetsum:${MEETSUM_IMAGE_TAG:-current}
    build:
      context: .
      args:
        MEETSUM_GIT_SHA: ${MEETSUM_GIT_SHA:-}
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Loopback only: public traffic must arrive through Traefik so the
      # X-Forwarded-For chain (and therefore rate limiting) can be trusted.
      - "127.0.0.1:${APP_PORT:-3005}:3000"
    env_file:
      - .env.local
    environment:
      # One trusted proxy hop (Traefik) appends the client address to XFF.
      MEETSUM_TRUSTED_PROXY_HOPS: ${MEETSUM_TRUSTED_PROXY_HOPS:-1}
    volumes:
      - /opt/meetsum/secrets:/opt/meetsum/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      # 127.0.0.11 (Docker embedded) first for service discovery; public IPv4
      # resolvers after it because the host's upstream is IPv6/Tailscale-only and
      # unreachable from containers (external DNS otherwise fails with EAI_AGAIN).
      - 127.0.0.11
      - 185.12.64.2
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Readiness: database, Redis, storage and migrations (M10 B3).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.meetsum.rule=Host(`meetsum.realization.co.il`)"
      - "traefik.http.routers.meetsum.entrypoints=https"
      - "traefik.http.routers.meetsum.tls.certresolver=letsencrypt"
      - "traefik.http.services.meetsum.loadbalancer.server.port=3000"
    networks:
      - default
      - coolify

  worker:
    image: meetsum:${MEETSUM_IMAGE_TAG:-current}
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env.local
    volumes:
      - /opt/meetsum/secrets:/opt/meetsum/secrets:ro
    dns:
      # 127.0.0.11 (Docker embedded) first for service discovery; public IPv4
      # resolvers after it because the host's upstream is IPv6/Tailscale-only and
      # unreachable from containers (external DNS otherwise fails with EAI_AGAIN).
      - 127.0.0.11
      - 185.12.64.2
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Worker health server (M10 B3): container-internal only, never published.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${MEETSUM_WORKER_HEALTH_PORT:-3101}/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    # What production runs: Postgres 17.9 on Alpine (musl; the data volume was
    # created by postgres:17-alpine). Moving to pgvector (Debian, glibc) needs a
    # collation refresh or a dump/restore: add docker-compose.pgvector.yml and
    # follow docs/runbooks/postgres-17-pgvector.md. Never switch it by editing
    # this line during an app deploy.
    image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    hostname: meetsum-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetings}
      POSTGRES_USER: ${POSTGRES_USER:-meetings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - meetsum-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meetings} -d ${POSTGRES_DB:-meetings}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # Production runs Redis 7.4.8 (from redis:7-alpine, AOF on); same minor
    # release here. A rebuilt tag can still have a different image ID than the
    # running container: scripts/infra-drift.sh compares IDs, and
    # docs/runbooks/upgrade-0.6-to-0.7.md shows how to pin the exact running
    # image in docker-compose.local.yml instead.
    image: redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      default:
        aliases:
          - meetsum-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # What production runs: the image `minio/minio:latest` resolved to when it
    # was pulled, RELEASE.2025-09-07T16-13-09Z. Pinned by TAG ONLY: MinIO stopped
    # publishing community images (R16) and minio/minio no longer resolves on
    # Docker Hub, so its digest cannot be verified from the registry (checked
    # 2026-10-14). This line only works on a host that already has the image
    # cached (the production VPS; tag it once, see
    # docs/runbooks/upgrade-0.6-to-0.7.md). A fresh host cannot pull it: use
    # the source-built image there with
    #   -f docker-compose.prod.yml -f docker-compose.minio-source.yml
    # (deploy/minio/Dockerfile; docs/runbooks/deploy.md "Images").
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    networks:
      default:
        aliases:
          - meetsum-minio
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5

  n8n:
    image: n8nio/n8n:2.43.4@sha256:c34ee9107a42b837e25cec0c8a927ab90a45b776aa2ccbf15e5b9cda466fad2c
    profiles:
      - automation
    restart: unless-stopped
    logging: *default-logging
    environment:
      N8N_HOST: ${N8N_HOST:-n8n.realization.co.il}
      N8N_PORT: 5678
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
    volumes:
      - n8n-data:/home/node/.n8n

  faster-whisper:
    # 0.5.0-cpu is the image `latest-cpu` pointed at (upstream renamed the
    # project to speaches; this repository no longer moves).
    image: fedirz/faster-whisper-server:0.5.0-cpu@sha256:760e5e43d427dc6cfbbc4731934b908b7de9c7e6d5309c6a1f0c8c923a5b6030
    profiles:
      - local-asr
    restart: unless-stopped
    logging: *default-logging
    environment:
      # CPU inference must use int8. The implicit default upcasts float16 ->
      # float32, which grew memory until the process crashed on long (>15 min)
      # recordings. int8 uses ~4x less RAM. NOTE: this VPS is memory-constrained
      # (~7.6 GB shared); for reliable long-Hebrew ASR, offload to the Ryzen
      # laptop's Lemonade Whisper and let Gemini handle the VPS fallback.
      WHISPER__COMPUTE_TYPE: int8
    volumes:
      - huggingface-cache:/root/.cache/huggingface

volumes:
  postgres-data:
  redis-data:
  minio-data:
  n8n-data:
  huggingface-cache:

networks:
  coolify:
    external: true
